<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% block title %}
    <title>SZTU 食堂管理系统</title>
    {% endblock %}
    <link rel="shortcut icon" href="{{ url_for('static', filename='img/logo.png') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='plugins/dropzone/min/dropzone.min.css') }}">
    <style>
        .app-sidebar {
            min-height: calc(100vh - 56px);
            background: #f8f9fa;
            border-right: 1px solid #e9ecef;
        }
    </style>
    {% block ext_css %}{% endblock %}
</head>
<body class="bg-body-tertiary">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
        <a class="navbar-brand fw-semibold" href="{{ url_for('views.index') }}">SZTU 食堂管理系统</a>
    </div>
</nav>
<div class="container-fluid">
    <div class="row">
        <aside class="col-12 col-md-3 col-lg-2 p-3 app-sidebar">
            <div class="list-group list-group-flush">
                <a href="{{ url_for('views.index') }}" class="list-group-item list-group-item-action">首页看板</a>
                <a href="{{ url_for('dish.dish_list') }}" class="list-group-item list-group-item-action">菜品信息</a>
                <a href="{{ url_for('stu.stu_list') }}" class="list-group-item list-group-item-action">学生信息</a>
                <a href="{{ url_for('dining.dining_list') }}" class="list-group-item list-group-item-action">就餐记录</a>
            </div>
        </aside>
        <main class="col-12 col-md-9 col-lg-10 p-3 p-md-4">
            {% block content %}{% endblock %}
        </main>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
<script src="{{ url_for('static', filename='plugins/jquery/jquery.min.js') }}"></script>
<script src="{{ url_for('static', filename='plugins/chart.js/Chart.min.js') }}"></script>
{% block ext_js %}{% endblock %}
</body>
</html>
