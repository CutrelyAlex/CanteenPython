{% extends 'base.html' %}

{% block content %}
<div class="card shadow-sm">
    <div class="card-header">
        <h2 class="h5 mb-0">学生信息修改</h2>
    </div>
    <form method="post" enctype="multipart/form-data" novalidate>
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">学生学号</label>
                    <input type="text" class="form-control" id="student_id" name="student_id" value="{{ s_id }}" readonly>
                </div>
                <div class="col-md-6">
                    <label class="form-label">学生名字</label>
                    {{ form.name }}
                    <div class="text-danger small">{{ form.name.errors[0] }}</div>
                </div>
                <div class="col-md-6">
                    <label class="form-label">学生密码</label>
                    {{ form.password }}
                    <div class="text-danger small">{{ form.password.errors[0] }}</div>
                </div>
                <div class="col-md-6">
                    <label class="form-label">学生年龄</label>
                    {{ form.age }}
                    <div class="text-danger small">{{ form.age.errors[0] }}</div>
                </div>
                <div class="col-md-6">
                    <label for="{{ form.gender.id_for_label }}" class="form-label">{{ form.gender.label }}</label>
                    {{ form.gender }}
                    <div class="text-danger small">{{ form.gender.errors[0] }}</div>
                </div>
                <div class="col-12">
                    <label class="form-label">学生自述</label>
                    {{ form.description }}
                </div>
            </div>
        </div>
        <div class="card-footer d-flex gap-2">
            <button type="submit" class="btn btn-primary">保存</button>
            <a class="btn btn-outline-secondary" href="{{ url_for('stu.stu_list') }}">返回</a>
        </div>
    </form>
</div>
{% endblock %}
