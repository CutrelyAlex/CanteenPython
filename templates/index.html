{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h4 mb-0">数据看板</h1>
    <span class="text-muted">最新更新：{{ format_now }}</span>
</div>

<div class="row g-3 mb-3">
    <div class="col-sm-6 col-lg-3">
        <div class="card shadow-sm">
            <div class="card-body">
                <h2 class="h6 text-muted">菜品数量</h2>
                <p class="display-6 mb-0">{{ all_dishes }}</p>
            </div>
        </div>
    </div>
    <div class="col-sm-6 col-lg-3">
        <div class="card shadow-sm">
            <div class="card-body">
                <h2 class="h6 text-muted">学生人数</h2>
                <p class="display-6 mb-0">{{ len_stu }}</p>
            </div>
        </div>
    </div>
</div>

<div class="row g-3">
    <div class="col-12">
        <div class="card shadow-sm">
            <div class="card-body">
                <h2 class="h6">菜品位置分布</h2>
                <canvas id="bar_2Chart" height="120"></canvas>
            </div>
        </div>
    </div>
    <div class="col-12 col-lg-6">
        <div class="card shadow-sm">
            <div class="card-body">
                <h2 class="h6">菜品消费情况（前五位）</h2>
                <canvas id="pieChart" height="220"></canvas>
            </div>
        </div>
    </div>
    <div class="col-12 col-lg-6">
        <div class="card shadow-sm">
            <div class="card-body">
                <h2 class="h6">就餐时间</h2>
                <canvas id="barChart" height="220"></canvas>
            </div>
        </div>
    </div>
    <div class="col-12 col-lg-6">
        <div class="card shadow-sm">
            <div class="card-body">
                <h2 class="h6">学生就餐位置次数</h2>
                <canvas id="polarAreaChart" height="220"></canvas>
            </div>
        </div>
    </div>
</div>

<script>
    $(function () {
        const charData = {
            labels: {{ labels|safe }},
            datasets: [{backgroundColor: ['#f56954', '#00a65a', '#f39c12', '#00c0ef', '#3c8dbc', '#d2d6de'], data: {{ datas }}}]
        };
        const charData2 = {
            labels: {{ time_labels|safe }},
            datasets: [{label: '就餐时间', backgroundColor: ['#f56954', '#00a65a', '#f39c12', '#00c0ef', '#3c8dbc', '#d2d6de'], data: {{ time_num }}}]
        };
        const charData3 = {
            labels: {{ location_labels|safe }},
            datasets: [{label: '就餐位置', backgroundColor: ['#f56954', '#00a65a', '#f39c12', '#00c0ef', '#3c8dbc', '#d2d6de'], data: {{ location_num }}}]
        };
        const charData4 = {
            labels: {{ location_dishes_labels|safe }},
            datasets: [{label: '菜品位置', backgroundColor: ['#f56954', '#00a65a', '#f39c12', '#00c0ef', '#3c8dbc', '#d2d6de'], data: {{ location_dishes_num }}}]
        };

        const maxCount = Math.max.apply(null, {{ time_num }});

        new Chart($('#polarAreaChart').get(0).getContext('2d'), {
            type: 'polarArea',
            data: charData3,
            options: {responsive: true, maintainAspectRatio: false, scale: {ticks: {beginAtZero: true, max: maxCount + 2}}}
        });
        new Chart($('#pieChart').get(0).getContext('2d'), {
            type: 'pie',
            data: charData,
            options: {maintainAspectRatio: false, responsive: true}
        });
        new Chart($('#barChart').get(0).getContext('2d'), {
            type: 'bar',
            data: charData2,
            options: {
                responsive: true,
                maintainAspectRatio: false,
                legend: {display: false},
                scales: {yAxes: [{ticks: {beginAtZero: true, stepSize: 1, max: maxCount + 2}}]}
            }
        });
        new Chart($('#bar_2Chart').get(0).getContext('2d'), {
            type: 'bar',
            data: charData4,
            options: {
                responsive: true,
                maintainAspectRatio: false,
                legend: {display: false},
                scales: {yAxes: [{ticks: {beginAtZero: true, stepSize: 1}}]}
            }
        });
    });
</script>
{% endblock %}
